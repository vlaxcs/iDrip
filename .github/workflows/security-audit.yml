name: Security audit

on:
  push:
    branches:
      - main
    paths:
      - "frontend/package-lock.json"
      - "backend/package-lock.json"
      - "ai-service/requirements.txt"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/package-lock.json"
      - "backend/package-lock.json"
      - "ai-service/requirements.txt"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Weekly Monday 06:00 UTC — catches CVEs disclosed against pinned deps
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-frontend:
    runs-on: ubuntu-latest
    name: npm audit (frontend)
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit (production deps, fail on high+)
        run: npm audit --omit=dev --audit-level=high

  audit-backend:
    runs-on: ubuntu-latest
    name: npm audit (backend)
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Audit (production deps, fail on high+)
        run: npm audit --omit=dev --audit-level=high

  audit-ai-service:
    runs-on: ubuntu-latest
    name: pip-audit (ai-service)
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit
        run: pip-audit -r requirements.txt --disable-pip
